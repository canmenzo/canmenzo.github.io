name: Project page preview builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-project-sites.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: project-subdomain-sites
          path: dist-projects/
          if-no-files-found: error
