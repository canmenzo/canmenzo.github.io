<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bir Isim Bir Islem solver - find an expression that hits the target." />
  <meta name="author" content="Can Menzo" />

  <script type="text/javascript">
    var host = "canmenzo.com";
    if (host == window.location.host && window.location.protocol != "https:")
      window.location.protocol = "https";
  </script>

  <link rel="stylesheet" href="../css/styles.css?v=6">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

  <link rel="canonical" href="https://canmenzo.com/numbers/">
  <link rel="icon" href="../favicon.ico?v=2">
  <title>Can Menzo | bir işlem solver</title>

  <style>
    :root {
      --bg: #ffffff;
      --inset: #f4f4f4;
      --border: #e3e3e3;
      --text: #111111;
      --muted: #666666;
      --accent: #1e6e1e;
    }

    body.dark-mode {
      --bg: #191a1b;
      --inset: #202122;
      --border: #2a2a2a;
      --text: #f1f1f1;
      --muted: #888888;
      --accent: #6fcf6f;
    }

    body, h2, .container {
      font-family: 'Fira Code', monospace;
    }

    .container {
      text-align: center;
      padding-top: 62px;
    }

    @media (min-width: 701px) {
      .container { text-align: center; }
    }

    /* Also in css/styles.css, repeated here on purpose: without these rules
       the link is a plain flex item of body and shoves the page sideways,
       so it must not depend on a stylesheet a phone may have cached. */
    .home-back,
    .home-back:visited {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 50;
      padding: 10px 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }

    .home-back:hover {
      text-decoration: underline;
    }

    .solver {
      max-width: 520px;
      margin: 0 auto;
      text-align: left;
    }

    .field {
      margin-bottom: 22px;
    }

    .field-label {
      margin-bottom: 9px;
      font-size: 0.74em;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .inputs-row {
      display: flex;
      gap: 8px;
    }

    input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 8px;
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: 'Fira Code', monospace;
      font-size: 0.95em;
      text-align: center;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .target {
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 18px 16px 16px;
      position: relative;
    }

    .target-label {
      position: absolute;
      top: -9px;
      left: 14px;
      padding: 0 8px;
      background-color: var(--bg);
      font-size: 0.74em;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    button#solve {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 5px;
      font-family: 'Fira Code', monospace;
      font-size: 0.88em;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button#solve:hover {
      opacity: 0.85;
    }

    #results {
      margin-top: 26px;
    }

    .solution-item {
      background: var(--inset);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 12px 14px;
      font-size: 0.88em;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .solution-item .eq {
      color: var(--accent);
      font-weight: 600;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: 0.82em;
    }

    .necdet-msg {
      text-align: center;
      margin-top: 16px;
      padding: 10px;
      font-size: 0.88em;
      font-weight: 600;
      color: var(--accent);
      border: 1px dashed var(--accent);
      border-radius: 5px;
    }

    @media (max-width: 560px) {
      .inputs-row { flex-wrap: wrap; }
      .inputs-row input[type="number"] { width: calc(33.33% - 6px); }
    }
  </style>
</head>

<body class="dark-mode">
  <a class="home-back" href="/">&larr; ~/home</a>

  <main class="container">
    <h2>bir işlem solver</h2>

    <div class="solver">
      <div class="field">
        <div class="field-label">// source numbers (up to 6)</div>
        <div class="inputs-row">
          <input type="number" class="num-input" placeholder="x" aria-label="source number 1">
          <input type="number" class="num-input" placeholder="y" aria-label="source number 2">
          <input type="number" class="num-input" placeholder="z" aria-label="source number 3">
          <input type="number" class="num-input" placeholder="a" aria-label="source number 4">
          <input type="number" class="num-input" placeholder="b" aria-label="source number 5">
          <input type="number" class="num-input" placeholder="c" aria-label="source number 6">
        </div>
      </div>

      <div class="field target">
        <span class="target-label">// target</span>
        <input type="number" id="target" placeholder="e.g. 752" aria-label="target number">
      </div>

      <button id="solve" onclick="runSolver()">find solution</button>

      <div id="results"></div>
    </div>
  </main>

  <button id="theme-toggle">dark mode: on</button>

  <script>
    const themeToggle = document.getElementById("theme-toggle");
    if (localStorage.getItem("dark-mode") === "disabled") {
      document.body.classList.remove("dark-mode");
    }
    const syncToggle = () => {
      themeToggle.textContent = "dark mode: " +
        (document.body.classList.contains("dark-mode") ? "on" : "off");
    };
    syncToggle();
    themeToggle.addEventListener("click", function () {
      document.body.classList.toggle("dark-mode");
      localStorage.setItem("dark-mode",
        document.body.classList.contains("dark-mode") ? "enabled" : "disabled");
      syncToggle();
    });
  </script>

  <script>
class Node {
    constructor(value, expression) {
        this.value = value;
        this.expression = expression;
    }
}

function runSolver() {
    const inputs = Array.from(document.querySelectorAll('.num-input'))
        .map(input => parseInt(input.value))
        .filter(val => !isNaN(val));

    const target = parseInt(document.getElementById('target').value);
    const resultsDiv = document.getElementById('results');

    resultsDiv.innerHTML = '';

    if (inputs.length === 0 || isNaN(target)) {
        resultsDiv.innerHTML = '<div class="empty-msg">enter source numbers and a target.</div>';
        return;
    }

    const solutions = new Set();
    const initialNodes = inputs.map(n => new Node(n, n.toString()));

    function solve(nodes) {
        for (let node of nodes) {
            if (node.value === target) {
                solutions.add(node.expression);
            }
        }

        if (nodes.length < 2) return;

        for (let i = 0; i < nodes.length; i++) {
            for (let j = 0; j < nodes.length; j++) {
                if (i === j) continue;

                const a = nodes[i];
                const b = nodes[j];
                const remaining = nodes.filter((_, index) => index !== i && index !== j);

                // Addition
                recurse(remaining, a.value + b.value, `(${a.expression} + ${b.expression})`);
                // Multiplication
                recurse(remaining, a.value * b.value, `(${a.expression} * ${b.expression})`);
                // Subtraction
                if (a.value > b.value) {
                    recurse(remaining, a.value - b.value, `(${a.expression} - ${b.expression})`);
                }
                // Division
                if (b.value !== 0 && a.value % b.value === 0) {
                    recurse(remaining, a.value / b.value, `(${a.expression} / ${b.expression})`);
                }
            }
        }
    }

    function recurse(remainingNodes, newValue, newExpr) {
        const nextNodes = [...remainingNodes, new Node(newValue, newExpr)];
        solve(nextNodes);
    }

    solve(initialNodes);

    if (solutions.size === 0) {
        resultsDiv.innerHTML = '<div class="empty-msg">no exact solutions found.</div>';
    } else {
        const one = Array.from(solutions)[0];
        const clean = one.startsWith('(') && one.endsWith(')') ? one.slice(1, -1) : one;

        resultsDiv.innerHTML = `
            <div class="solution-item">
                <span>${clean}</span> <span class="eq">= ${target}</span>
            </div>
            <div class="necdet-msg">necdeti yatirdim.</div>`;
    }
}
  </script>
</body>

</html>
