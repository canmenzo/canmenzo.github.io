<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">

  <title>2006</title>

  <style>
    /* Blogger template "897" by Douglas Bowman (2004), without its hosted gifs */
    body {
      background: #ccc;
      margin: 0;
      padding: 10px 0 14px;
      font: small Verdana, sans-serif;
      text-align: center;
      color: #000;
    }

    #wrap {
      position: relative;
      top: 4px;
      left: 4px;
      background: #999;
      width: 744px;
      margin: 0 auto;
      text-align: left;
    }

    #wrap2 {
      position: relative;
      top: -4px;
      left: -4px;
      background: #fff;
      padding: 10px;
    }

    #content {
      background: #cdb;
      width: 100%;
      font-size: 85%;
      overflow: hidden;
    }

    #main {
      background: #245;
      width: 460px;
      float: left;
      color: #fff;
      border-top-right-radius: 14px;
    }

    #sidebar {
      width: 254px;
      float: right;
      color: #356;
    }

    #main2 { padding: 15px 20px; }
    #sidebar2 { padding: 2px 20px 10px; }

    a:link { color: #369; text-decoration: none; }
    a:visited { color: #776; text-decoration: none; }
    a:hover { color: #333; text-decoration: underline; }
    a img { border-width: 0; }
    #main a:link { color: #9df; }
    #main a:visited { color: #7a9; }
    #main a:hover { color: #fff; }

    #header {
      background: #269;
      padding: 0 0 0 160px;
      margin: 0 0 10px;
      color: #fff;
    }

    #blog-title {
      margin: 0;
      padding: 40px 0 0;
      font: bold 275%/97px Helvetica, Arial, Verdana, sans-serif;
      text-transform: lowercase;
    }

    #description {
      background: #8df;
      margin: 0 0 10px;
      padding: 12px 0;
      color: #fff;
    }

    #description p { margin: 0; }

    #description em {
      display: block;
      padding: 0 0 0 160px;
      font: bold 75%/1.6em Arial, Verdana, sans-serif;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .date-header {
      margin: 0 0 .5em;
      font: bold 112%/1.4em Arial, Verdana, sans-serif;
      text-transform: lowercase;
      color: #467;
    }

    .post { margin: 0 0 2em; }
    .post-body { margin: 0 0 .75em; line-height: 1.6em; text-align: center; }

    .post img {
      display: block;
      max-width: 400px;
      width: 100%;
      margin: 0 auto 10px;
      border: 5px solid #fff;
      box-sizing: border-box;
    }

    .post-footer { color: #467; text-transform: lowercase; }
    .post-footer em { font-style: normal; color: #689; }

    .sidebar-title {
      margin: 1em 0 .25em;
      font: bold 150%/1.4em Helvetica, Arial, Verdana, sans-serif;
      color: #fff;
      text-transform: lowercase;
    }

    #sidebar ul { margin: 0 0 1.5em; padding: 0; list-style: none; }
    #sidebar li { padding: 0 0 .25em 20px; text-indent: -20px; line-height: 1.4em; }
    #sidebar p { margin: 0 0 .75em; line-height: 1.4em; }
    .profile-datablock { margin: 0 0 .75em; line-height: 1.4em; }
    .profile-datablock dd { margin: 0; font-weight: bold; }

    #gate {
      padding: 30px 0 40px;
      text-align: center;
    }

    #gate p { margin: 0 0 1em; color: #9df; }

    #gate input, #gate button {
      font: inherit;
      padding: 4px 6px;
      border: 2px solid #356;
    }

    #gate input { width: 180px; }
    #gate button { background: #cdb; color: #245; font-weight: bold; cursor: pointer; }
    #gate .error { color: #f99; min-height: 1.4em; margin-top: 1em; }

    @media (max-width: 760px) {
      body { padding: 0; }
      #wrap { width: auto; top: 0; left: 0; }
      #wrap2 { top: 0; left: 0; padding: 0; }
      #header, #description em { padding-left: 16px; }
      #blog-title { font-size: 200%; line-height: 60px; padding-top: 10px; }
      #main, #sidebar { width: 100%; float: none; }
      #main2, #sidebar2 { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>

    document.getElementById('gate').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      const bytes = Uint8Array.from(atob(payload), c => c.charCodeAt(0));
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('password').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes.slice(0, 16), iterations: 600000 }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      try {
        const html = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(16, 28) }, key, bytes.slice(28));
        document.getElementById('wrap2').innerHTML = new TextDecoder().decode(html);
      } catch {
        error.textContent = 'yanlış şifre.';
      }
    });
  </script>
