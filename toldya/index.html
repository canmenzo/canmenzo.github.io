  <script>
    // No third-party script runs on this origin: the writings editor keeps a GitHub token
    // in localStorage here. The player is a plain cross-origin embed driven by postMessage.
    // Muted autoplay is allowed everywhere (no click, no thumbnail).
    // First user gesture (mouse/scroll/key/touch) unmutes -> full rickroll.
    var gestures = ["mousemove", "click", "keydown", "scroll", "touchstart"];
    var ready = false;
    var player = document.createElement("iframe");
    player.id = "player";
    player.width = 560;
    player.height = 315;
    player.title = "told ya";
    player.frameBorder = "0";
    player.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    player.referrerPolicy = "strict-origin-when-cross-origin";
    player.src = "https://www.youtube.com/embed/AACOcpA8i-U?" + new URLSearchParams({
        autoplay: 1, mute: 1, controls: 0, modestbranding: 1, playsinline: 1, rel: 0, fs: 0,
        disablekb: 1, loop: 1, playlist: "AACOcpA8i-U", enablejsapi: 1, origin: location.origin
    });
    document.getElementById("player").replaceWith(player);

    function send(message) {
        player.contentWindow.postMessage(JSON.stringify(message), "https://www.youtube.com");
    }

    function command(func, args) { send({ event: "command", func: func, args: args || [] }); }

    // The player answers once it is ready and has heard from us.
    var hello = setInterval(function () { send({ event: "listening" }); }, 250);
    window.addEventListener("message", function (e) {
        if (ready || e.source !== player.contentWindow) return;
        ready = true;
        clearInterval(hello);
        command("playVideo");
    });

    function unmute() {
        if (!ready) return; // player not ready yet; keep listeners
        command("unMute");
        command("setVolume", [100]);
        command("playVideo");
        gestures.forEach(function (ev) { document.removeEventListener(ev, unmute); });
    }

    gestures.forEach(function (ev) { document.addEventListener(ev, unmute); });
  </script>

  <script type="module">
    // Firebase over plain REST, no SDK. The apiKey is public by design, it identifies the project,
    // it does not authorise anything. Firestore rules are the only thing guarding this.
    // The rules require auth, but the page signs up anonymously, so being
    // authenticated is free for anyone and the count can be set to whatever they like.
    // Fine for a rickroll counter. Do not put anything else in this Firebase project.
    const apiKey = "AIzaSyBwRCRWxQ1KhOheUffYEhLw15_qbfLm7ns";
    const counterUrl = "https://firestore.googleapis.com/v1/projects/rickrollcounter-cae1b/databases/(default)/documents/visitCount/counter";
    const counter = document.getElementById("counter");

    let headers;
    try {
        const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ returnSecureToken: true })
        });
        if (!res.ok) throw new Error(`sign-in failed: ${res.status}`);
        headers = { "Authorization": `Bearer ${(await res.json()).idToken}`, "Content-Type": "application/json" };
    } catch (error) {
        console.error("Error signing in:", error);
        counter.textContent = "error signing in. please try again later.";
    }

    if (headers) {
        try {
            const res = await fetch(counterUrl, { headers });
            if (res.status === 404) {
                // If the counter document doesn't exist, initialize it
                fetch(counterUrl, { method: "PATCH", headers, body: JSON.stringify({ fields: { count: { integerValue: "1" } } }) });
                counter.textContent = "this page has been visited 1 time.";
            } else {
                if (!res.ok) throw new Error(`read failed: ${res.status}`);
                const field = (await res.json()).fields?.count ?? {};
                const newCount = (Number(field.integerValue ?? field.doubleValue) || 0) + 1;
                fetch(`${counterUrl}?updateMask.fieldPaths=count&currentDocument.exists=true`, {
                    method: "PATCH",
                    headers,
                    body: JSON.stringify({ fields: { count: { integerValue: String(newCount) } } })
                });
                counter.textContent = `this page has been visited ${newCount} times.`;
            }
        } catch (error) {
            console.error("Error fetching counter:", error);
            counter.textContent = "could not load counter. please try again later.";
        }
    }
  </script>
