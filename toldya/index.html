  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Muted autoplay is allowed everywhere (no click, no thumbnail).
    // First user gesture (mouse/scroll/key/touch) unmutes -> full rickroll.
    var player;
    var gestures = ["mousemove", "click", "keydown", "scroll", "touchstart"];

    function onYouTubeIframeAPIReady() {
        player = new YT.Player("player", {
            width: 560,
            height: 315,
            videoId: "AACOcpA8i-U",
            playerVars: {
                autoplay: 1,
                mute: 1,
                controls: 0,
                modestbranding: 1,
                playsinline: 1,
                rel: 0,
                fs: 0,
                disablekb: 1,
                loop: 1,
                playlist: "AACOcpA8i-U"
            },
            events: {
                onReady: function (e) { e.target.playVideo(); }
            }
        });
    }

    function unmute() {
        if (!player || !player.unMute) return; // player not ready yet; keep listeners
        player.unMute();
        player.setVolume(100);
        player.playVideo();
        gestures.forEach(function (ev) { document.removeEventListener(ev, unmute); });
    }

    gestures.forEach(function (ev) { document.addEventListener(ev, unmute); });
  </script>

  <!-- Firebase SDK -->
  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

    // Firebase config. The apiKey is public by design, it identifies the project,
    // it does not authorise anything. Firestore rules are the only thing guarding this.
    // The rules require auth, but the page calls signInAnonymously, so being
    // authenticated is free for anyone and the count can be set to whatever they like.
    // Fine for a rickroll counter. Do not put anything else in this Firebase project.
    const firebaseConfig = {
        apiKey: "AIzaSyBwRCRWxQ1KhOheUffYEhLw15_qbfLm7ns",
        authDomain: "rickrollcounter-cae1b.firebaseapp.com",
        projectId: "rickrollcounter-cae1b",
        storageBucket: "rickrollcounter-cae1b.firebasestorage.app",
        messagingSenderId: "236132264688",
        appId: "1:236132264688:web:00e922496222d296cd3035"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const counterRef = doc(db, "visitCount", "counter");

    console.log("Firebase initialized. Attempting to fetch counter...");

    // Wait for DOM to fully load
    document.addEventListener("DOMContentLoaded", function() {
        // Sign in anonymously
        signInAnonymously(auth)
            .then(() => {
                console.log("User signed in anonymously");

                // Fetch and update the visit counter from Firestore
                getDoc(counterRef).then(docSnap => {
                    console.log("Firestore document fetched.");

                    if (docSnap.exists()) {
                        const currentCount = Number(docSnap.data().count) || 0;
                        const newCount = currentCount + 1;

                        // Update Firestore with the new count
                        updateDoc(counterRef, { count: newCount });

                        // Display the counter on the page
                        document.getElementById("counter").textContent = `this page has been visited ${Number(newCount)} times.`;
                    } else {
                        console.log("Document does not exist, creating it...");

                        // If the counter document doesn't exist, initialize it
                        setDoc(counterRef, { count: 1 });

                        // Display the counter on the page
                        document.getElementById("counter").textContent = "this page has been visited 1 time.";
                    }
                }).catch((error) => {
                    console.error("Error fetching counter:", error);
                    document.getElementById("counter").textContent = "could not load counter. please try again later.";
                });
            })
            .catch((error) => {
                console.error("Error signing in:", error);
                document.getElementById("counter").textContent = "error signing in. please try again later.";
            });
    });
  </script>
